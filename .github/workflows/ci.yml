# On every push to main and every pull request: every test in both builds, then the checks of the
# tests themselves. Runs in Fedora, the development platform, so CI uses the same GCC.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same pull request supersedes a run still in progress. Runs on main are never
# cancelled, so every commit there gets its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      # fedora:44, pinned by digest so the image can't change under the same name. Fedora's
      # repositories keep only the newest update of each package, so the packages can't be pinned
      # the same way; the versions step below records what each run used.
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
      # The debugger tests run GDB and LLDB, which need to trace the programs they start.
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    env:
      # A missing debugger fails its tests here instead of skipping them.
      FILLSCOPE_REQUIRE_DEBUGGERS: "1"
      # A warning in our own code fails the build.
      FILLSCOPE_WERROR: "ON"
      # Compiles go through ccache, whose store is kept between runs (below).
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
    steps:
      - name: Install the toolchain
        run: >
          dnf install -y --setopt=install_weak_deps=False
          gcc-c++ libasan libubsan cmake ninja-build git python3 ccache
          glfw-devel mesa-libGL-devel gdb lldb python3-lldb nodejs npm util-linux-core
      # Actions are pinned to the commit of a release (named in the comment), not a movable tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # the whole history: the attribution check runs git blame
      - name: Trust the checkout
        # The container runs as root and the checkout belongs to another user, which git refuses.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .cache/ccache
          # A new key each run, so each saves its store; a run starts from the newest saved one.
          key: ccache-${{ github.sha }}
          restore-keys: ccache-
      - name: Toolchain versions
        run: g++ --version | head -1; cmake --version | head -1; gdb --version | head -1; lldb --version; node --version
      - name: Every test, normal and sanitizer builds
        run: tests/scripts/run-tests.sh
      - name: Each deliberate bug is caught by a test
        run: python3 -I tests/scripts/mutants.py
      - name: Test selection picks, runs and records the right programs
        run: python3 -I tests/scripts/selection_check.py
